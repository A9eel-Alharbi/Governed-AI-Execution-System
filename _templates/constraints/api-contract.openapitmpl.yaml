components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateSubscriptionRequest:
      type: object
      required: [tenantId, planCode]
      properties:
        tenantId:
          type: string
          format: uuid
        planCode:
          type: string
        cancelAt:
          type: string
          format: date-time
          nullable: true
    Subscription:
      type: object
      required: [id, tenantId, planCode, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
        planCode:
          type: string
        status:
          type: string
          enum: [trialing, active, past_due, canceled]
        createdAt:
          type: string
          format: date-time
          readOnly: true
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
