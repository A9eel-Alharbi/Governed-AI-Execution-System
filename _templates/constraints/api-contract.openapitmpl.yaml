openapi: 3.1.0
info:
  title: "[required: service name] API"
  version: "0.1.0"
  summary: "[required: bounded context summary]"
  description: >
    [required: concise description of the API surface covered by this contract.
    Prose-only API specs are forbidden. This OpenAPI file is the machine-readable source of truth.]
servers:
  - url: https://api.example.com
    description: production
tags:
  - name: subscriptions
    description: Example resource tag
paths:
  /v1/subscriptions:
    post:
      tags: [subscriptions]
      summary: Create subscription
      description: >
        [required: one-sentence behavior summary]
      operationId: createSubscription
      security:
        - bearerAuth: []
      x-aos:
        owner: "[required: API owner]"
        lastValidated: "YYYY-MM-DD"
        stabilityClass: "low"
        rateLimit: "60 requests/minute per tenant"
        changeClassification:
          requestBody: "breaking"
          responseBody: "breaking"
          newOptionalField: "non-breaking"
        fieldRules:
          readOnly:
            - id
            - createdAt
          writeOnce:
            - tenantId
          nullable:
            - cancelAt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
            examples:
              default:
                value:
                  tenantId: "4d8b8e34-22fb-4aa4-a942-c6a76219df9d"
                  planCode: "pro-monthly"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
              examples:
                default:
                  value:
                    id: "f2c8847d-f23f-43cc-b393-2dc650d6085f"
                    tenantId: "4d8b8e34-22fb-4aa4-a942-c6a76219df9d"
                    planCode: "pro-monthly"
                    status: "active"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
