[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-stack"
version = "0.1.0"
description = "A governed interpretation and dispatch control layer for agentic software systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Open Source Contributors" }
]
dependencies = [
  "PyYAML>=6.0"
]
keywords = ["agents", "tool-calling", "governance", "dispatch", "aos-cdd"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.scripts]
agent-control-stack = "agent_control_stack.cli:main"
agent-control-stack-api = "agent_control_stack.service:main"
agent-control-stack-eval = "agent_control_stack.eval:main"
agent-control-stack-report = "agent_control_stack.ops_report:main"
agent-control-stack-policy-gate = "agent_control_stack.policy_gate:main"
agent-control-stack-maintain = "agent_control_stack.run_maintenance:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agent_control_stack*"]

[tool.setuptools.package-data]
agent_control_stack = [
  "runtime/*.yaml",
  "schemas/*.json"
]
